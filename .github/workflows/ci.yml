name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Types
        run: mypy
      - name: Architecture
        run: lint-imports
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Self-test of the entry point
        run: python -m sizeout_demo --selftest

  mutations:
    runs-on: windows-latest
    needs: check
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Every planted bug must be caught
        run: python tools/mutation_check.py
